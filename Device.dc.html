<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./image-slot.js"></script></helmet>
<div style="width:100%;height:100%;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden;color:#ECEAE3">
  <div ref="{{ box }}" style="flex:1;min-height:0;min-width:0;display:flex;align-items:center;justify-content:center;overflow:hidden">

    <sc-if value="{{ isPhone }}" hint-placeholder-val="{{ false }}">
      <div style="{{ holder }}"><div style="{{ inner }}">
        <x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" dark="{{ true }}" hint-size="402px,874px">
          <div style="position:absolute;inset:0;background:#0b0b0c">
            <sc-if value="{{ pHome }}" hint-placeholder-val="{{ true }}">
              <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:30px 14px;padding:92px 30px 0">
                <sc-for list="{{ items }}" as="it" hint-placeholder-count="6">
                  <button type="button" onClick="{{ it.pick }}" aria-label="{{ it.name }}" style="display:flex;flex-direction:column;align-items:center;gap:7px;padding:0;background:none;border:0;cursor:pointer;color:#fff">
                    <sc-if value="{{ it.hasThumb }}" hint-placeholder-val="{{ false }}"><span style="width:84px;height:84px;border-radius:20px;background-size:cover;background-position:center;background-image:url({{ it.thumb }})"></span></sc-if>
                    <sc-if value="{{ it.noThumb }}" hint-placeholder-val="{{ true }}"><span style="width:84px;height:84px;border-radius:20px;background:#1d1d1b;border:1px solid #3A3936;display:grid;place-items:center;font:500 19px/1 'IBM Plex Mono',monospace;color:#9A9890">{{ it.glyph }}</span></sc-if>
                    <span style="font:400 15px/1.2 Inter,system-ui,sans-serif;text-align:center;max-width:108px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ it.short }}</span>
                  </button>
                </sc-for>
              </div>
            </sc-if>
            <sc-if value="{{ pLive }}" hint-placeholder-val="{{ false }}"><iframe src="{{ pSrc }}" title="{{ name }}" allow="fullscreen; autoplay; clipboard-write" style="position:absolute;inset:0;width:100%;height:100%;border:0;background:#000"></iframe></sc-if>
            <sc-if value="{{ pSlot }}" hint-placeholder-val="{{ false }}"><image-slot id="{{ slotId }}" shape="rect" placeholder="{{ slotText }}" style="position:absolute;inset:0;width:100%;height:100%"></image-slot></sc-if>
            <sc-if value="{{ pPlate }}" hint-placeholder-val="{{ false }}">
              <div style="position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 34px;text-align:center">
                <span style="font:400 11px/1 'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:#9A9890">{{ status }}</span>
                <span style="font:300 34px/1.1 Fraunces,Georgia,serif;letter-spacing:-.02em;margin-top:12px">{{ name }}</span>
              </div>
            </sc-if>
          </div>
        </x-import>
      </div></div>
    </sc-if>

    <sc-if value="{{ isMon }}" hint-placeholder-val="{{ false }}">
      <div style="{{ holder }}"><div style="{{ inner }}">
        <sc-for list="{{ screens }}" as="m" hint-placeholder-count="1">
          <figure style="margin:0;width:1468px;flex:0 0 auto">
            <div style="background:#0b0b0c;border-radius:28px;padding:14px 14px 0;box-shadow:inset 0 0 0 2px #2a2a2c">
              <div style="position:relative;width:1440px;height:900px;border-radius:8px;overflow:hidden;background:#161615">
                <sc-if value="{{ m.desk }}" hint-placeholder-val="{{ true }}">
                  <div style="position:absolute;inset:0;display:grid;grid-auto-flow:column;grid-template-rows:repeat(4,190px);gap:14px 30px;padding:52px 56px;justify-content:start;align-content:start">
                    <sc-for list="{{ m.items }}" as="it" hint-placeholder-count="7">
                      <button type="button" onClick="{{ it.pick }}" aria-label="{{ it.name }}" style="width:170px;display:flex;flex-direction:column;align-items:center;gap:14px;padding:0;background:none;border:0;cursor:pointer;color:#ECEAE3">
                        <sc-if value="{{ it.hasThumb }}" hint-placeholder-val="{{ false }}"><span style="width:112px;height:112px;border-radius:26px;background-size:cover;background-position:center;background-image:url({{ it.thumb }})"></span></sc-if>
                        <sc-if value="{{ it.noThumb }}" hint-placeholder-val="{{ true }}"><span style="width:112px;height:112px;border-radius:26px;background:#1d1d1b;border:2px solid #3A3936;display:grid;place-items:center;font:500 28px/1 'IBM Plex Mono',monospace;color:#9A9890">{{ it.glyph }}</span></sc-if>
                        <span style="font:400 23px/1.2 Inter,system-ui,sans-serif;text-align:center;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ it.short }}</span>
                      </button>
                    </sc-for>
                  </div>
                </sc-if>
                <sc-if value="{{ m.web }}" hint-placeholder-val="{{ false }}"><iframe src="{{ m.src }}" title="{{ m.title }}" allow="fullscreen; pointer-lock" style="position:absolute;inset:0;width:100%;height:100%;border:0;background:#000"></iframe></sc-if>
                <sc-if value="{{ m.plate }}" hint-placeholder-val="{{ false }}">
                  <div style="position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center">
                    <span style="font:400 26px/1 'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:#9A9890">{{ m.status }}</span>
                    <span style="font:300 110px/1.05 Fraunces,Georgia,serif;letter-spacing:-.03em;margin-top:28px">{{ m.title }}</span>
                  </div>
                </sc-if>
              </div>
              <div style="height:44px;display:grid;place-items:center"><i style="display:block;width:12px;height:12px;border-radius:50%;background:#2e2e31"></i></div>
            </div>
            <div style="width:260px;height:22px;margin:0 auto;background:#0b0b0c;border-radius:0 0 16px 16px"></div>
            <sc-if value="{{ m.hasLabel }}" hint-placeholder-val="{{ false }}"><figcaption style="height:110px;padding-top:30px;text-align:center;font:400 64px/1 Fraunces,Georgia,serif">{{ m.label }}</figcaption></sc-if>
          </figure>
        </sc-for>
      </div></div>
    </sc-if>

    <sc-if value="{{ isGate }}" hint-placeholder-val="{{ false }}">
      <div style="{{ holder }}"><div style="{{ inner }}">
        <figure style="margin:0;width:1468px;flex:0 0 auto">
          <div style="background:#0b0b0c;border-radius:28px;padding:14px 14px 0;box-shadow:inset 0 0 0 2px #2a2a2c">
            <div style="position:relative;width:1440px;height:900px;border-radius:8px;overflow:hidden;background:#161615;display:flex;flex-direction:column;justify-content:center;gap:36px;padding:0 220px">
              <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:24px">
                <sc-for list="{{ gates }}" as="g" hint-placeholder-count="3">
                  <button type="button" onClick="{{ g.toggle }}" aria-pressed="{{ g.on }}" style="min-height:150px;text-align:left;padding:26px 30px;background:none;border:2px solid #ECEAE3;border-radius:4px;color:#ECEAE3;font:500 28px/1.5 'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase;cursor:pointer">{{ g.n }}<span style="display:block;color:#9A9890">{{ g.state }}</span></button>
                </sc-for>
              </div>
              <div style="border:2px solid #8FA0FF;border-radius:4px;padding:40px">
                <div style="font:300 64px/1.1 Fraunces,Georgia,serif;letter-spacing:-.02em">{{ gateLine }}</div>
                <div style="font:400 28px/1.7 'IBM Plex Mono',monospace;color:#9A9890;margin-top:18px">uuid {{ uuid }}<br>δt {{ dt }} s · generation {{ gen }}</div>
                <button type="button" onClick="{{ rebirth }}" disabled="{{ noBirth }}" style="margin-top:28px;min-height:96px;padding:0 40px;font:500 26px/1 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:#ECEAE3;background:none;border:2px solid #3A3936;border-radius:999px;cursor:pointer">Restart = birth, new UUID</button>
              </div>
            </div>
            <div style="height:44px;display:grid;place-items:center"><i style="display:block;width:12px;height:12px;border-radius:50%;background:#2e2e31"></i></div>
          </div>
          <div style="width:260px;height:22px;margin:0 auto;background:#0b0b0c;border-radius:0 0 16px 16px"></div>
        </figure>
      </div></div>
    </sc-if>
  </div>

  <div style="flex:0 0 40px;display:flex;align-items:center;justify-content:center;gap:10px">
    <sc-if value="{{ canHome }}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{ goHome }}" style="height:30px;padding:0 14px;background:none;border:1px solid #3A3936;border-radius:999px;color:#ECEAE3;font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;white-space:nowrap" style-hover="border-color:#8FA0FF;color:#8FA0FF">{{ homeLabel }}</button></sc-if>
    <sc-if value="{{ canInfo }}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{ goInfo }}" aria-label="{{ infoLabel }}" style="width:30px;height:30px;padding:0;background:none;border:1px solid #3A3936;border-radius:50%;color:#ECEAE3;font:400 14px/1 Fraunces,Georgia,serif;font-style:italic;cursor:pointer" style-hover="border-color:#8FA0FF;color:#8FA0FF">i</button></sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:620},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;mon&quot;,&quot;options&quot;:[&quot;phone&quot;,&quot;mon&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;items&quot;:{&quot;editor&quot;:null,&quot;default&quot;:[],&quot;tsType&quot;:&quot;object[]&quot;},&quot;open&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;object|null&quot;},&quot;home&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;()=&gt;void&quot;},&quot;info&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;()=&gt;void&quot;}}">
class Component extends DCLogic {
  state = { w: 0, h: 0, pw: true, se: true, mo: true, alive: true, uuid: this.newId(), dt: 0, gen: 1 };
  box = React.createRef();
  newId() { try { return crypto.randomUUID(); } catch (e) { return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, () => ((Math.random() * 16) | 0).toString(16)); } }
  componentDidMount() {
    const fit = this.fit = () => { const el = this.box.current; if (!el) return; const w = el.clientWidth, h = el.clientHeight; if (w && h && (w !== this.state.w || h !== this.state.h)) this.setState({ w, h }); };
    const el = this.box.current;
    if (el && window.ResizeObserver) { this.ro = new ResizeObserver(fit); this.ro.observe(el); }
    fit(); this.tm = [0, 100, 500, 1500].map(t => setTimeout(fit, t)); addEventListener('resize', fit);
    this.timer = setInterval(() => {
      const s = this.state; if (((this.props.open || {}).id) !== 'frame' || !s.alive) return;
      if (s.pw && s.se && s.mo) this.setState({ dt: s.dt + 0.1 }); else this.setState({ alive: false });
    }, 100);
  }
  componentDidUpdate() { if (this.fit) this.fit(); }
  componentWillUnmount() { if (this.ro) this.ro.disconnect(); clearInterval(this.timer); (this.tm || []).forEach(clearTimeout); removeEventListener('resize', this.fit); }
  renderVals() {
    const s = this.state, pr = this.props, phone = pr.kind === 'phone', o = pr.open || null, id = o && o.id, L = true;
    const LOCALHOST = /^(127\.0\.0\.1|localhost)$/.test(location.hostname), APP = LOCALHOST ? { void: 'http://127.0.0.1:8768/', ezer: 'http://127.0.0.1:8766/', morgan: 'http://127.0.0.1:8767/' } : { void: 'https://void-app-d35c.pages.dev/', ezer: 'https://ezer-demo.daniel4chigs.workers.dev/', morgan: 'https://morgan-demo.daniel4chigs.workers.dev/app/' };
    const WEB = { hugo: 'realms/hugo/index.html', revelation: 'https://revelati6n.com' };
    const scr = (x) => ({ items: [], desk: false, web: false, plate: false, src: '', title: '', status: '', label: '', hasLabel: false, ...x });
    let screens = [], gate = false;
    if (!phone) {
      if (!o) screens = [scr({ desk: true, items: pr.items || [] })];
      else if (id === 'stores') screens = [['https://impact-threads.com/', 'Impact Threads'], ['https://live-maren.com/', 'MAREN'], ['https://www.slysculpted.com/', 'Sly Sculpted']].map(([src, label]) => scr({ web: true, src, title: label, label, hasLabel: true }));
      else if (WEB[id]) screens = [scr({ web: true, src: WEB[id], title: o.name })];
      else if (id === 'frame') gate = true;
      else screens = [scr({ plate: true, title: o.name, status: o.status })];
    }
    const W = s.w || 1, H = s.h || 1, n = screens.length;
    const fits = phone ? [[402, 874]] : n > 1 ? [[3 * 1468 + 160, 1090], [2 * 1468 + 80, 2 * 1090 + 80], [1468, 3 * 1090 + 160]] : [[1468, 980]];
    let LW = fits[0][0], LH = fits[0][1], k = 0;
    for (const [fa, fb] of fits) { const q = Math.min(1, W / fa, H / fb); if (q > k) { k = q; LW = fa; LH = fb; } }
    const open = s.pw && s.se && s.mo;
    return {
      box: this.box, isPhone: phone, isMon: !phone && !gate, isGate: gate, screens, items: pr.items || [],
      holder: { width: LW * k, height: LH * k, position: 'relative', flex: '0 0 auto' },
      inner: { position: 'absolute', left: 0, top: 0, width: LW, height: LH, transform: 'scale(' + k + ')', transformOrigin: '0 0', display: 'flex', flexWrap: 'wrap', justifyContent: 'center', alignContent: 'flex-start', gap: 80 },
      pHome: phone && !o, pLive: phone && !!o && !!APP[id] && L, pSrc: (L && APP[id]) || '', pSlot: phone && !!o && !!APP[id] && !L, pPlate: phone && !!o && !APP[id],
      slotId: 'shot-' + id, slotText: 'Drop a portrait screenshot of ' + ((o && o.name) || 'the app'), name: (o && o.name) || '', status: (o && o.status) || '',
      canHome: !!o && !!pr.home, goHome: () => pr.home && pr.home(), homeLabel: phone ? '← Home screen' : '← Desktop',
      canInfo: !!pr.info, goInfo: () => pr.info && pr.info(), infoLabel: 'Details for ' + ((o && o.name) || 'this project'),
      gates: [['pw', 'Power'], ['se', 'Sensors'], ['mo', 'Motor']].map(([key, name]) => ({ n: name, on: s[key], state: s[key] ? 'holding' : 'cut', toggle: () => this.setState({ [key]: !s[key] }) })),
      gateLine: s.alive ? 'Gate open. Identity is accruing.' : 'ENDED. This one does not come back.',
      uuid: s.uuid, dt: s.dt.toFixed(1), gen: s.gen, noBirth: s.alive || !open,
      rebirth: () => this.setState({ alive: true, uuid: this.newId(), dt: 0, gen: s.gen + 1 }),
    };
  }
}
</script>
</body>
</html>
