                  <button type="button" onClick="{{ it.pick }}" aria-label="{{ it.name }}" style="display:flex;flex-direction:column;align-items:center;gap:7px;padding:0;background:none;border:0;cursor:pointer;color:#fff">

            </sc-if>
            <sc-if value="{{ pLive }}" hint-placeholder-val="{{ false }}"><iframe src="{{ pSrc }}" title="{{ name }}" onLoad="{{ pLoaded }}" allow="fullscreen; autoplay; clipboard-write" style="position:absolute;inset:0;width:100%;height:100%;border:0;background:#000"></iframe></sc-if>
            <sc-if value="{{ pSkel }}" hint-placeholder-val="{{ false }}">
              <div aria-hidden="true" style="position:absolute;inset:0;background:#0b0b0c;padding:74px 22px 0;display:flex;flex-direction:column;gap:16px">
                <span style="height:34px;width:46%;border-radius:10px;background:linear-gradient(90deg,#17171a 25%,#232327 50%,#17171a 75%);background-size:200% 100%;animation:skel 1.4s linear infinite"></span>

                <span style="height:120px;border-radius:22px;background:linear-gradient(90deg,#17171a 25%,#232327 50%,#17171a 75%);background-size:200% 100%;animation:skel 1.4s linear infinite"></span>

            </sc-if>
            <sc-if value="{{ pSlot }}" hint-placeholder-val="{{ false }}"><image-slot id="{{ slotId }}" shape="rect" placeholder="{{ slotText }}" style="position:absolute;inset:0;width:100%;height:100%"></image-slot></sc-if>
            <sc-if value="{{ pPlate }}" hint-placeholder-val="{{ false }}">
              <div style="position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 34px;text-align:center">
                <span style="font:300 34px/1.1 Fraunces,Georgia,serif;letter-spacing:-.02em">{{ name }}</span>
              </div>
            </sc-if>
            <sc-if value="{{ pNotes }}" hint-placeholder-val="{{ false }}">
              <div style="position:absolute;inset:0;padding-top:62px;display:flex;flex-direction:column;background:#161615">
                <sc-if value="{{ pList }}" hint-placeholder-val="{{ true }}">
                  <h3 style="margin:0;padding:10px 22px 14px;font:400 32px/1.1 Fraunces,Georgia,serif">Notes</h3>
                  <div style="flex:1;min-height:0;overflow-y:auto">

                      <button type="button" onClick="{{ nt.pick }}" style="display:block;width:100%;text-align:left;padding:12px 22px;background:none;border:0;border-top:1px solid #262624;color:#ECEAE3;cursor:pointer">

                      <span style="height:300px;border-radius:24px;background:linear-gradient(90deg,#1a1a19 25%,#242423 50%,#1a1a19 75%);background-size:200% 100%;animation:skel 1.4s linear infinite"></span>
                      <span style="height:26px;width:80%;border-radius:8px;background:linear-gradient(90deg,#1a1a19 25%,#242423 50%,#1a1a19 75%);background-size:200% 100%;animation:skel 1.4s linear infinite"></span>

                <sc-if value="{{ m.plate }}" hint-placeholder-val="{{ false }}">
                  <div style="position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center">
                    <span style="font:300 110px/1.05 Fraunces,Georgia,serif;letter-spacing:-.03em">{{ m.title }}</span>

                    <div style="border-right:2px solid #262624;overflow-y:auto;padding-top:44px">
                      <div style="padding:0 40px 24px;font:400 22px/1 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:#9A9890">Notes · other projects</div>
                      <sc-for list="{{ m.noteList }}" as="nt" hint-placeholder-count="6">
                        <button type="button" onClick="{{ nt.pick }}" aria-pressed="{{ nt.sel }}" style="position:relative;display:block;width:100%;text-align:left;padding:20px 40px;background:none;border:0;border-top:2px solid #262624;color:#ECEAE3;cursor:pointer">
                          <span style="display:block;font:400 19px/1.4 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:#9A9890">{{ nt.status }}</span>
                          <span style="display:block;font:400 38px/1.15 Fraunces,Georgia,serif">{{ nt.name }}</span>

                    <div style="overflow-y:auto;padding:90px 110px">

                </sc-if>
              </div>
              <div style="height:44px;display:grid;place-items:center"><i style="display:block;width:12px;height:12px;border-radius:50%;background:#2e2e31"></i></div>
            </div>
            <div style="width:260px;height:22px;margin:0 auto;background:#0b0b0c;border-radius:0 0 16px 16px"></div>
            <sc-if value="{{ m.hasLabel }}" hint-placeholder-val="{{ false }}"><figcaption style="height:110px;padding-top:30px;text-align:center;font:400 64px/1 Fraunces,Georgia,serif">{{ m.label }}</figcaption></sc-if>

        <figure style="margin:0;width:1468px;flex:0 0 auto">
          <div style="background:#0b0b0c;border-radius:28px;padding:14px 14px 0;box-shadow:inset 0 0 0 2px #2a2a2c">
            <div style="position:relative;width:1440px;height:900px;border-radius:8px;overflow:hidden;background:#161615;display:flex;flex-direction:column;justify-content:center;gap:36px;padding:0 220px">
              <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:24px">
                <sc-for list="{{ gates }}" as="g" hint-placeholder-count="3">
                  <button type="button" onClick="{{ g.toggle }}" aria-pressed="{{ g.on }}" style="min-height:150px;text-align:left;padding:26px 30px;background:none;border:2px solid #ECEAE3;border-radius:4px;color:#ECEAE3;font:500 28px/1.5 'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase;cursor:pointer">{{ g.n }}<span style="display:block;color:#9A9890">{{ g.state }}</span></button>
                </sc-for>
              </div>
              <div style="border:2px solid #8FA0FF;border-radius:4px;padding:40px">
                <div style="font:300 64px/1.1 Fraunces,Georgia,serif;letter-spacing:-.02em">{{ gateLine }}</div>
                <div style="font:400 28px/1.7 'IBM Plex Mono',monospace;color:#9A9890;margin-top:18px">uuid {{ uuid }}<br>δt {{ dt }} s · generation {{ gen }}</div>
                <button type="button" onClick="{{ rebirth }}" disabled="{{ noBirth }}" style="margin-top:28px;min-height:96px;padding:0 40px;font:500 26px/1 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:#ECEAE3;background:none;border:2px solid #3A3936;border-radius:999px;cursor:pointer">Restart = birth, new UUID</button>
              </div>
            </div>
            <div style="height:44px;display:grid;place-items:center"><i style="display:block;width:12px;height:12px;border-radius:50%;background:#2e2e31"></i></div>
          </div>
          <div style="width:260px;height:22px;margin:0 auto;background:#0b0b0c;border-radius:0 0 16px 16px"></div>
        </figure>
      </div></div>
    </sc-if>
  </div>

  <div style="{{ barStyle }}">
    <sc-if value="{{ canHome }}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{ goHome }}" style="height:30px;padding:0 14px;background:none;border:1px solid #3A3936;border-radius:999px;color:#ECEAE3;font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;white-space:nowrap" style-hover="border-color:#8FA0FF;color:#8FA0FF">{{ homeLabel }}</button></sc-if>
    <sc-if value="{{ canInfo }}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{ goInfo }}" aria-label="{{ infoLabel }}" style="width:30px;height:30px;padding:0;background:none;border:1px solid #3A3936;border-radius:50%;color:#ECEAE3;font:400 14px/1 Fraunces,Georgia,serif;font-style:italic;cursor:pointer" style-hover="border-color:#8FA0FF;color:#8FA0FF">i</button></sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:620},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;mon&quot;,&quot;options&quot;:[&quot;phone&quot;,&quot;mon&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;items&quot;:{&quot;editor&quot;:null,&quot;default&quot;:[],&quot;tsType&quot;:&quot;object[]&quot;},&quot;open&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;object|null&quot;},&quot;home&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;()=&gt;void&quot;},&quot;info&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;()=&gt;void&quot;}}">

    const fit = this.fit = () => { const el = this.box.current; if (!el) return; const w = el.clientWidth, h = el.clientHeight; if (w && h && (w !== this.state.w || h !== this.state.h)) this.setState({ w, h }); };
    const el = this.box.current;
    if (el && window.ResizeObserver) { this.ro = new ResizeObserver(fit); this.ro.observe(el); }
    fit(); this.tm = [0, 100, 500, 1500].map(t => setTimeout(fit, t)); addEventListener('resize', fit);
    this.timer = setInterval(() => {
      const s = this.state; if (((this.props.open || {}).id) !== 'frame' || !s.alive) return;
      if (s.pw && s.se && s.mo) this.setState({ dt: s.dt + 0.1 }); else this.setState({ alive: false });
    }, 100);
  }
  componentDidUpdate(p) { if (this.fit) this.fit(); if (p.note !== this.props.note && this.state.note) this.setState({ note: null }); }
  componentWillUnmount() { if (this.ro) this.ro.disconnect(); clearInterval(this.timer); (this.tm || []).forEach(clearTimeout); removeEventListener('resize', this.fit); Object.values(this.pend || {}).forEach(clearTimeout); }

  renderVals() {
    const s = this.state, pr = this.props, phone = pr.kind === 'phone', o = pr.open || null, id = o && o.id, L = true;
