<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./image-slot.js"></script></helmet>
<div ref="{{ box }}" style="width:100%;height:100%;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;color:#ECEAE3">

  <sc-if value="{{ isPhone }}" hint-placeholder-val="{{ false }}">
    <div style="{{ holder }}"><div style="{{ inner }}">
      <x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" dark="{{ true }}" hint-size="402px,874px">
        <div style="position:absolute;inset:0;background:#000">
          <sc-if value="{{ live }}" hint-placeholder-val="{{ false }}"><iframe src="{{ src }}" title="{{ title }}" allow="fullscreen; autoplay; clipboard-write" style="position:absolute;inset:0;width:100%;height:100%;border:0;background:#000"></iframe></sc-if>
          <sc-if value="{{ posterOn }}" hint-placeholder-val="{{ true }}">
            <sc-if value="{{ noEnter }}" hint-placeholder-val="{{ true }}"><image-slot id="{{ slotId }}" shape="rect" placeholder="{{ slotText }}" style="position:absolute;inset:0;width:100%;height:100%"></image-slot></sc-if>
            <sc-if value="{{ canEnter }}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{ enter }}" style="position:absolute;inset:0;width:100%;height:100%;display:grid;place-items:center;background:rgba(0,0,0,.35);border:0;cursor:pointer;color:#fff"><span style="border:1px solid rgba(255,255,255,.7);padding:12px 20px;border-radius:999px;font:500 12px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;background:rgba(0,0,0,.45)">{{ cta }}</span></button></sc-if>
            
          </sc-if>
        </div>
      </x-import>
    </div></div>
  </sc-if>

  <sc-if value="{{ phoneNote }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;left:0;right:0;bottom:0;text-align:center;font:400 11px/1.4 'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:#9A9890;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Live on 127.0.0.1 · drop a screenshot</div></sc-if>

  <sc-if value="{{ isMon }}" hint-placeholder-val="{{ false }}">
    <div style="{{ holder }}"><div style="{{ inner }}">
      <sc-for list="{{ screens }}" as="m" hint-placeholder-count="1">
        <figure style="margin:0;width:1468px;flex:0 0 auto">
          <div style="background:#0b0b0c;border-radius:28px;padding:14px 14px 0;box-shadow:inset 0 0 0 2px #2a2a2c">
            <div style="position:relative;width:1440px;height:900px;border-radius:8px;overflow:hidden;background:#000">
              <sc-if value="{{ m.live }}" hint-placeholder-val="{{ false }}"><iframe src="{{ m.src }}" title="{{ m.title }}" allow="fullscreen; pointer-lock" style="position:absolute;inset:0;width:100%;height:100%;border:0;background:#000"></iframe></sc-if>
              <sc-if value="{{ m.posterOn }}" hint-placeholder-val="{{ true }}">
                <div style="position:absolute;inset:0;background-size:cover;background-position:center top;background-image:url({{ m.poster }})"></div>
                <button type="button" onClick="{{ m.enter }}" style="position:absolute;inset:0;width:100%;height:100%;display:grid;place-items:center;background:rgba(0,0,0,.35);border:0;cursor:pointer;color:#fff"><span style="border:2px solid rgba(255,255,255,.7);padding:26px 44px;border-radius:999px;font:500 26px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;background:rgba(0,0,0,.45)">{{ m.cta }}</span></button>
              </sc-if>
            </div>
            <div style="height:44px;display:grid;place-items:center"><i style="display:block;width:12px;height:12px;border-radius:50%;background:#2e2e31"></i></div>
          </div>
          <div style="width:260px;height:22px;margin:0 auto;background:#0b0b0c;border-radius:0 0 16px 16px"></div>
          <sc-if value="{{ m.hasLabel }}" hint-placeholder-val="{{ false }}"><figcaption style="height:110px;padding-top:30px;text-align:center;font:400 64px/1 Fraunces,Georgia,serif">{{ m.label }}</figcaption></sc-if>
        </figure>
      </sc-for>
    </div></div>
  </sc-if>

  <sc-if value="{{ isBare }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;background:#000">
      <sc-if value="{{ live }}" hint-placeholder-val="{{ false }}"><iframe src="{{ src }}" title="{{ title }}" allow="fullscreen; pointer-lock; autoplay; clipboard-write" style="position:absolute;inset:0;width:100%;height:100%;border:0;background:#000"></iframe></sc-if>
      <sc-if value="{{ posterOn }}" hint-placeholder-val="{{ true }}">
        <sc-if value="{{ noEnter }}" hint-placeholder-val="{{ true }}"><image-slot id="{{ slotId }}" shape="rect" placeholder="{{ slotText }}" style="position:absolute;inset:0;width:100%;height:100%"></image-slot></sc-if>
        <sc-if value="{{ canEnter }}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{ enter }}" style="position:absolute;inset:0;width:100%;height:100%;display:grid;place-items:center;background:rgba(0,0,0,.35);border:0;cursor:pointer;color:#fff"><span style="border:1px solid rgba(255,255,255,.7);padding:12px 20px;border-radius:999px;font:500 12px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;background:rgba(0,0,0,.45)">{{ cta }}</span></button></sc-if>
        
      </sc-if>
    </div>
  </sc-if>

  <sc-if value="{{ isGate }}" hint-placeholder-val="{{ false }}">
    <div style="width:100%;max-width:560px;max-height:100%;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;font:400 13px/1.45 Inter,system-ui,sans-serif">
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
        <sc-for list="{{ gates }}" as="g" hint-placeholder-count="3">
          <button type="button" onClick="{{ g.toggle }}" aria-pressed="{{ g.on }}" style="min-height:60px;text-align:left;padding:10px 12px;background:none;border:1px solid #ECEAE3;border-radius:2px;color:#ECEAE3;font:500 11px/1.5 'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase;cursor:pointer" style-hover="border-color:#8FA0FF">{{ g.n }}<span style="display:block;color:#9A9890">{{ g.state }}</span></button>
        </sc-for>
      </div>
      <div style="border:1px solid #8FA0FF;border-radius:2px;padding:16px">
        <div style="font:300 26px/1.15 Fraunces,Georgia,serif">{{ gateLine }}</div>
        <div style="font:12px/1.7 'IBM Plex Mono',monospace;color:#9A9890;margin-top:8px">uuid {{ uuid }}<br>δt {{ dt }} s · generation {{ gen }}</div>
        <button type="button" onClick="{{ rebirth }}" disabled="{{ noBirth }}" style="margin-top:12px;min-height:44px;padding:0 16px;font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:#ECEAE3;background:none;border:1px solid #3A3936;border-radius:999px;cursor:pointer">Restart = birth, new UUID</button>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ isPlate }}" hint-placeholder-val="{{ false }}">
    <div style="width:100%;max-width:640px;padding:24px;text-align:center">
      <p style="margin:0;font:300 44px/1.1 Fraunces,Georgia,serif;letter-spacing:-.02em">{{ status }}</p>
      <div style="margin-top:14px;font:400 11px/1 'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:#9A9890">Nothing to run yet</div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:600},&quot;p&quot;:{&quot;editor&quot;:null,&quot;default&quot;:{&quot;id&quot;:&quot;frame&quot;,&quot;name&quot;:&quot;Mortal Agent Frame&quot;},&quot;tsType&quot;:&quot;object&quot;},&quot;bare&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;auto&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { entered: {}, w: 0, h: 0, pw: true, se: true, mo: true, alive: true, uuid: this.newId(), dt: 0, gen: 1 };
  box = React.createRef();
  newId() { try { return crypto.randomUUID(); } catch (e) { return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, () => ((Math.random() * 16) | 0).toString(16)); } }
  componentDidMount() {
    const el = this.box.current, fit = () => { if (!el) return; const w = el.clientWidth, h = el.clientHeight; if (w && h && (w !== this.state.w || h !== this.state.h)) this.setState({ w, h }); };
    if (el && window.ResizeObserver) { this.ro = new ResizeObserver(fit); this.ro.observe(el); } fit();
    this.timer = setInterval(() => {
      const s = this.state; if ((this.props.p || {}).id !== 'frame' || !s.alive) return;
      if (s.pw && s.se && s.mo) this.setState({ dt: s.dt + 0.1 }); else this.setState({ alive: false });
    }, 100);
  }
  componentWillUnmount() { if (this.ro) this.ro.disconnect(); clearInterval(this.timer); }
  renderVals() {
    const p = this.props.p || {}, id = p.id, s = this.state, bare = !!this.props.bare, L = true;
    const LOCALHOST = /^(127\.0\.0\.1|localhost)$/.test(location.hostname), APP = LOCALHOST ? { void: 'http://127.0.0.1:8768/', ezer: 'http://127.0.0.1:8766/', morgan: 'http://127.0.0.1:8767/' } : { void: 'https://void-app-d35c.pages.dev/', ezer: 'https://ezer-demo.daniel4chigs.workers.dev/', morgan: 'https://morgan-demo.daniel4chigs.workers.dev/app/' };
    const mk = (key, src, title, poster, cta, label) => { const can = !!src, on = can && (!!this.props.auto || !poster || !!s.entered[key]);
      return { src: on ? src : '', title: title || '', live: on, posterOn: !on, poster: poster || '', canEnter: can && !on, noEnter: !can, cta: cta || 'Open', label: label || '', hasLabel: !!label, enter: () => this.setState({ entered: { ...s.entered, [key]: true } }) }; };
    let kind = 'plate', screens = [];
    if (id === 'stores') { kind = 'mon'; screens = [mk('impact', 'https://impact-threads.com/', 'Impact Threads', '', '', 'Impact Threads'), mk('maren', 'https://live-maren.com/', 'MAREN', '', '', 'MAREN'), mk('sly', 'https://www.slysculpted.com/', 'Sly Sculpted', '', '', 'Sly Sculpted')]; }
    else if (id === 'hugo' || id === 'revelation') { kind = bare ? 'bare' : 'mon'; screens = [mk(id, id === 'hugo' ? 'realms/hugo/index.html' : 'https://revelati6n.com', p.name, p.poster, p.cta)]; }
    else if (APP[id]) { kind = bare ? 'bare' : 'phone'; screens = [mk(id, L ? APP[id] : '', p.name, p.poster, p.cta)]; }
    else if (id === 'frame') kind = 'gate';
    const W = s.w || 800, H0 = s.h || 500, note = kind === 'phone' && !L, H = note ? H0 - 26 : H0, n = screens.length;
    const fits = kind === 'phone' ? [[402, 874]] : n > 1 ? [[3 * 1468 + 160, 1090], [2 * 1468 + 80, 2 * 1090 + 80], [1468, 3 * 1090 + 160]] : [[1468, 980]];
    let LW = fits[0][0], LH = fits[0][1], k = 0;
    for (const [fa, fb] of fits) { const q = Math.min(1, W / fa, H / fb); if (q > k) { k = q; LW = fa; LH = fb; } }
    const open = s.pw && s.se && s.mo, s0 = screens[0] || mk('x', '', '', '', '');
    return {
      box: this.box, isPhone: kind === 'phone', isMon: kind === 'mon', isBare: kind === 'bare', isGate: kind === 'gate', isPlate: kind === 'plate', screens,
      holder: { width: LW * k, height: LH * k, position: 'relative', flex: '0 0 auto', marginBottom: note ? 26 : 0 }, phoneNote: note,
      slotId: 'shot-' + id, slotText: 'Drop a portrait screenshot of ' + (p.name || 'the app'),
      inner: { position: 'absolute', left: 0, top: 0, width: LW, height: LH, transform: 'scale(' + k + ')', transformOrigin: '0 0', display: 'flex', flexWrap: 'wrap', justifyContent: 'center', alignContent: 'flex-start', gap: 80 },
      live: s0.live, src: s0.src, title: s0.title, posterOn: s0.posterOn, poster: s0.poster, canEnter: s0.canEnter, noEnter: s0.noEnter, cta: s0.cta, enter: s0.enter,
      status: p.status || '', line: p.line || '',
      gates: [['pw', 'Power'], ['se', 'Sensors'], ['mo', 'Motor']].map(([key, name]) => ({ n: name, on: s[key], state: s[key] ? 'holding' : 'cut', toggle: () => this.setState({ [key]: !s[key] }) })),
      gateLine: s.alive ? 'Gate open. Identity is accruing.' : 'ENDED. This one does not come back.',
      uuid: s.uuid, dt: s.dt.toFixed(1), gen: s.gen, noBirth: s.alive || !open,
      rebirth: () => this.setState({ alive: true, uuid: this.newId(), dt: 0, gen: s.gen + 1 }),
    };
  }
}
</script>
</body>
</html>
