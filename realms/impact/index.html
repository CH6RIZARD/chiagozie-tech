<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Impact Threads — Four prints, two editions</title>
<meta name="description" content="Four prints, two editions. Back print tees $28.99, new long sleeves $38.99, chest graphics only from $24.99. Free US shipping on 2+ pieces.">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--gold:#C4A57B;--grey:#8A8A8A;--line:#1A1A1A;--line2:#2A2A2A;--dim:#4A4A4A;--paper:#fff;--ink:#0A0A0A}
*{box-sizing:border-box}
html,body{margin:0;background:#000;color:#fff;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{overflow-x:hidden}
button{font-family:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
img{display:block}
.hide{display:none!important}
.noscroll{overflow:hidden}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes drop{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
.page{padding:32px 20px 64px;max-width:640px;margin:0 auto}.d-page{padding-top:112px}
.page h1{margin:0 0 20px;font:400 56px/.9 'Bebas Neue',sans-serif}
.page h2{margin:36px 0 12px;font:400 30px/1 'Bebas Neue',sans-serif;letter-spacing:.04em}
.note{font:400 14px/1.6 'Inter',sans-serif;color:var(--grey);margin:16px 0 0}
.tbl{width:100%;border-collapse:collapse;font:400 14px/1.4 'Inter',sans-serif}.tbl th{text-align:left;font:500 10px/1 'Inter',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);padding:0 0 12px}.tbl td{padding:12px 0;border-top:1px solid var(--line)}.tbl td:first-child{font:400 22px/1 'Bebas Neue',sans-serif}
.cform{display:flex;flex-direction:column;gap:16px}.cform label{display:flex;flex-direction:column;gap:6px;font:500 10px/1 'Inter',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--grey)}.cform input,.cform textarea{background:#000;border:1px solid var(--line2);color:#fff;padding:14px;font:400 15px/1.4 'Inter',sans-serif;border-radius:0}.cform input:focus,.cform textarea:focus{outline:0;border-color:var(--gold)}.hp{display:none}
.menu{display:flex;flex-direction:column;padding:8px 20px 32px}.menu a{padding:18px 0;border-bottom:1px solid var(--line);font:400 34px/1 'Bebas Neue',sans-serif;letter-spacing:.04em}.d-cart .menu{padding:8px 32px 32px}
.m-ov{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.6)}
.m-menu{position:fixed;top:56px;left:0;right:0;z-index:10;background:#0A0A0A;border-bottom:1px solid var(--gold);animation:fadeIn .2s ease}
.m-menu-hd{display:flex;justify-content:space-between;align-items:center;padding:14px 20px 0}.m-menu-hd span{font:400 22px/1 'Bebas Neue',sans-serif;letter-spacing:.1em;color:var(--gold)}.m-menu-hd button{font:400 11px/1 'Inter',sans-serif;letter-spacing:.12em;color:var(--grey)}
.m-menu .menu a{font-size:26px;padding:14px 0}.m-menu .menu a:last-child{border-bottom:0}

/* ---------- shared controls ---------- */
.sizes{display:flex;gap:8px;flex-wrap:wrap}
.size{min-width:52px;height:52px;padding:0 8px;background:#000;border:1px solid var(--line2);font:400 20px/1 'Bebas Neue',sans-serif}
.size.on{border-color:var(--gold);color:var(--gold)}
.colors{display:flex;gap:8px}
.color{display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;background:#000;border:1px solid var(--line2);color:var(--grey);font:400 11px/1 'Inter',sans-serif;letter-spacing:.1em;text-transform:uppercase}
.color.on{border-color:var(--gold);color:var(--gold)}
.color i{display:block;width:12px;height:12px;border:1px solid var(--line2)}
.qty{display:inline-flex;border:1px solid var(--line2)}
.qty button{width:40px;height:44px;background:#000;font:400 18px/1 'Inter',sans-serif}
.qty span{width:32px;display:flex;align-items:center;justify-content:center;font:500 14px/1 'Inter',sans-serif}
.qty.sm button{width:32px;height:32px;background:transparent;font-size:16px}
.qty.sm span{width:28px;font-size:12px}
.add{display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:56px;background:var(--gold);color:#000;font:400 18px/1 'Bebas Neue',sans-serif;letter-spacing:.16em;width:100%}
.gold-btn{display:flex;align-items:center;justify-content:center;height:56px;background:var(--gold);color:#000;font:400 18px/1 'Bebas Neue',sans-serif;letter-spacing:.18em}
.ghost-btn{height:52px;padding:0 28px;border:1px solid var(--gold);color:var(--gold);font:400 17px/1 'Bebas Neue',sans-serif;letter-spacing:.16em}
.ulink{font:400 11px/1 'Inter',sans-serif;color:var(--grey);text-decoration:underline;text-underline-offset:3px}
.thumbs{display:flex;gap:8px}
.thumb{width:60px;height:75px;border:1px solid var(--line);background:#fff;overflow:hidden}
.thumb.on{border-color:var(--gold)}
.thumb img{width:100%;height:100%;object-fit:cover}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:50;background:var(--gold);color:#000;padding:12px 18px;font:400 15px/1 'Bebas Neue',sans-serif;letter-spacing:.12em;animation:fadeIn .2s}
.kick{font:500 10px/1 'Inter',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.6)}

/* ---------- header ---------- */
.m-hdr{position:sticky;top:0;z-index:12;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;height:56px;padding:0 12px;background:#000}
.m-burger{display:flex;flex-direction:column;gap:5px;width:20px}
.m-burger span{display:block;height:1px;background:#fff}
.m-burger span+span{width:12px}
.m-x{font:300 28px/1 'Inter',sans-serif;text-align:left}
.m-back{text-align:left;white-space:nowrap;font:400 11px/1 'Inter',sans-serif;letter-spacing:.1em}
.m-logo{display:flex;flex-direction:column;align-items:center;justify-self:center}.m-logo img{height:46px;width:auto}
.caret{display:block;width:8px;height:8px;border-right:1px solid var(--gold);border-bottom:1px solid var(--gold);transform:rotate(45deg);margin-top:-6px;transition:transform .2s}
.open .caret{transform:rotate(-135deg);margin-top:0}
/* nudge: pulse the dropdown trigger until the visitor opens it once */
@keyframes nudge{0%,100%{transform:scale(1);filter:none}50%{transform:scale(1.07);filter:drop-shadow(0 0 6px rgba(196,165,123,.7))}}
@keyframes nudgeCaret{0%,100%{transform:rotate(45deg) translate(0,0)}50%{transform:rotate(45deg) translate(2px,2px)}}
.nudge .m-logo,.nudge .d-hdr .c{animation:nudge 1.8s ease-in-out infinite}
.nudge .caret{animation:nudgeCaret 1.8s ease-in-out infinite}
.nudge .d-hdr .l{animation:nudge 1.8s ease-in-out infinite;color:var(--gold)}
@media (prefers-reduced-motion:reduce){.nudge .m-logo,.nudge .d-hdr .c,.nudge .caret,.nudge .d-hdr .l{animation:none}}
.cart-ico{position:relative;justify-self:end;width:24px;height:24px}
.cart-ico b{position:absolute;left:3px;right:3px;top:7px;bottom:1px;border:1px solid #fff}
.cart-ico i{position:absolute;left:7px;right:7px;top:1px;height:9px;border:1px solid #fff;border-bottom:0}
.cart-ico em{position:absolute;top:-6px;right:-8px;min-width:16px;height:16px;padding:0 4px;background:var(--gold);color:#000;font:600 10px/16px 'Inter',sans-serif;font-style:normal;text-align:center}
.ship{height:34px;display:flex;align-items:center;justify-content:center;border-top:1px solid var(--line);font:500 10px/1 'Inter',sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--grey)}

/* ---------- collage dropdown ---------- */
.sh-ov{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.55)}
.sheet{position:fixed;top:56px;left:0;right:0;bottom:0;z-index:11;overflow-y:auto;overflow-x:hidden;background:var(--paper);color:var(--ink);animation:drop .25s ease;-webkit-overflow-scrolling:touch}
.sh-top{display:flex;justify-content:space-between;align-items:center;padding:18px 24px 16px;border-bottom:1px solid #e6e6e6;font:500 10px/1 'Inter',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#777}
.sh-top button{font:600 10px/1 'Inter',sans-serif;letter-spacing:.2em;color:var(--ink)}
.grp-hd{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:26px 24px 6px}
.grp-hd h3{margin:0;font:400 26px/1 'Bebas Neue',sans-serif;letter-spacing:.04em}.grp-hd h3 b{font-weight:400;color:#9a7b4f}
.grp-hd span{font:500 13px/1 'Inter',sans-serif;white-space:nowrap}
.grp-sub{padding:0 24px;font:400 11px/1.4 'Inter',sans-serif;color:#777}
.clg{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;padding:4px 14px 8px}
.pc{position:relative;display:block;width:var(--w,52%);margin-top:var(--mt,0);margin-left:var(--ml,0);transform:rotate(var(--r,0deg));z-index:var(--z,1);transition:transform .25s}
.pc:hover{transform:rotate(0) scale(1.03);z-index:5}
.pc img{width:100%;height:auto;mix-blend-mode:multiply}
.pc .lb{display:block;width:max-content;max-width:100%;margin:-4px auto 0;padding:1px 5px;background:rgba(255,255,255,.88);font:500 11px/1.3 'Inter',sans-serif;color:var(--ink);text-align:center;white-space:nowrap}
.pc .lb i{font-style:normal;color:#777}
.rack{display:flex;padding:10px 14px 0;align-items:flex-start}
.rack .pc{--w:27%}
.rack .pc+.pc{margin-left:-2.6%}
.rack .lb{font-size:9.5px;white-space:normal;line-height:1.25}
.rack-n{padding:14px 24px 0;font:400 18px/1 'Bebas Neue',sans-serif;letter-spacing:.06em}
.sh-ft{margin-top:28px;padding:20px 24px 32px;border-top:1px solid #e6e6e6;font:400 11px/1.6 'Inter',sans-serif;color:#777}

/* ---------- home ---------- */
.hero{position:relative;display:block;height:calc(100svh - 90px);min-height:520px;max-height:760px;overflow:hidden;background:#0A0A0A}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.hero:after{content:"";position:absolute;inset:auto 0 0 0;height:55%;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.92));pointer-events:none}
.hero-txt{position:absolute;z-index:1;left:20px;right:20px;bottom:24px;display:flex;flex-direction:column;gap:10px}
.hero h1,.hero h2{margin:0;font:400 54px/.88 'Bebas Neue',sans-serif;text-wrap:pretty}
.hero-row{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.hero-row b{font:500 20px/1 'Inter',sans-serif;color:var(--gold);font-weight:500}
.hero-row span{height:48px;padding:0 30px;display:flex;align-items:center;background:var(--gold);color:#000;font:400 18px/1 'Bebas Neue',sans-serif;letter-spacing:.2em}
.shop{background:var(--paper);color:var(--ink);padding-bottom:28px}
.shop,.shop .grp-hd{scroll-margin-top:56px}
.shop .grp-hd{border-top:1px solid #e6e6e6;margin:0 20px;padding:24px 0 8px}
.shop .grp-hd:first-child{border-top:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;padding:6px 14px 10px}
.card{display:block}
.card img{width:100%;aspect-ratio:1;object-fit:contain;mix-blend-mode:multiply}
.card b{display:block;margin-top:2px;font:500 12px/1.3 'Inter',sans-serif}
.card small{display:block;font:400 11px/1.4 'Inter',sans-serif;color:#777}
.foot{border-top:1px solid var(--line);padding:24px 20px 40px;display:flex;flex-direction:column;gap:18px;font:400 11px/1.6 'Inter',sans-serif;letter-spacing:.06em;color:var(--grey)}
.foot nav{display:flex;flex-wrap:wrap;gap:12px 18px;text-transform:uppercase}
.foot span{color:var(--dim)}

/* ---------- product (ad landing) ---------- */
.m-hero{position:relative;height:620px;overflow:hidden;background:#0A0A0A}
.m-track{position:absolute;inset:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}.m-track::-webkit-scrollbar{display:none}
.m-track img{flex:none;width:100%;height:100%;object-fit:cover;object-position:50% 15%;scroll-snap-align:start;background:#fff}
.m-track img.co{object-fit:contain}
.m-hero:after{content:"";position:absolute;inset:auto 0 0 0;height:45%;background:linear-gradient(180deg,rgba(0,0,0,0),#000);pointer-events:none}
.m-hero-txt{position:absolute;z-index:1;left:20px;right:20px;bottom:20px;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.m-hero h1{margin:0;font:400 56px/.88 'Bebas Neue',sans-serif;text-wrap:pretty}
.m-hero p{margin:0;font:400 13px/1.5 'Inter',sans-serif;color:var(--grey)}
.m-thumbs{padding:16px 20px 0}
.m-buy{padding:28px 20px 48px;display:flex;flex-direction:column;gap:22px}
.m-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.m-price{font:500 22px/1 'Inter',sans-serif;color:var(--gold)}
.m-cart{position:fixed;inset:0;z-index:20;background:#000;display:flex;flex-direction:column;animation:fadeIn .25s ease}
.m-cart-hd{display:flex;align-items:flex-end;justify-content:space-between;padding:24px 20px 16px;border-bottom:1px solid var(--gold)}
.m-cart-hd h2{margin:0;font:400 72px/.8 'Bebas Neue',sans-serif}
.m-cart-hd button{padding-bottom:6px;font:400 11px/1 'Inter',sans-serif;letter-spacing:.12em;color:var(--grey)}
.m-cart-list{flex:1;overflow:auto;padding:0 20px}
.m-item{display:grid;grid-template-columns:120px 1fr;gap:16px;padding:20px 0;border-bottom:1px solid var(--line)}
.m-item>img{width:120px;height:150px;object-fit:contain;background:#fff;border:1px solid var(--line)}
.m-item>div{display:flex;flex-direction:column;justify-content:space-between}
.m-item h3{margin:6px 0 0;font:400 26px/.92 'Bebas Neue',sans-serif;text-wrap:pretty}
.m-item .v{margin-top:8px;font:400 10px/1.4 'Inter',sans-serif;letter-spacing:.1em;color:var(--grey);text-transform:uppercase}
.m-item .r{display:flex;justify-content:space-between;align-items:center}
.m-item .t{font:500 13px/1 'Inter',sans-serif;color:var(--gold)}
.m-cart-ft{padding:20px 20px 32px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
.m-cart-ft .s{display:flex;justify-content:space-between;align-items:baseline}
.m-cart-ft .s span{font:500 10px/1 'Inter',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--grey)}
.m-cart-ft .s b{font:500 20px/1 'Inter',sans-serif;color:var(--gold)}
.m-cart-ft small{text-align:center;font:400 11px/1 'Inter',sans-serif;color:var(--grey)}
.m-empty{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:0 20px;gap:24px}
.m-empty h3{margin:0;font:400 44px/.95 'Bebas Neue',sans-serif}

/* ---------- DESKTOP ---------- */
#desk{display:none}
@media (min-width:900px){
  #mob{display:none}
  #desk{display:block}
  .d-hdr{position:fixed;top:0;left:0;right:0;z-index:12;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:72px;padding:0 48px;background:#000}
  .d-hdr .l{justify-self:start;font:400 11px/1 'Inter',sans-serif;letter-spacing:.12em}
  .d-hdr .c{display:flex;flex-direction:column;align-items:center}.d-hdr .c img{height:56px;width:auto}
  .d-hdr .r{justify-self:end;font:400 11px/1 'Inter',sans-serif;letter-spacing:.12em}
  .d-hdr .r b{color:var(--gold);font-weight:400}
  .d-sp{height:72px}
  .sheet{top:72px;bottom:auto;max-height:calc(100vh - 72px)}
  .sh-cols{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:24px;padding:0 24px}
  .sh-top{padding:18px 48px 16px}
  .sh-cols .grp-hd{padding:24px 10px 6px}.sh-cols .grp-sub{padding:0 10px}.sh-cols .clg,.sh-cols .rack{padding-left:0;padding-right:0}.sh-cols .rack-n{padding-left:10px}
  .sh-ft{padding:20px 48px 28px}
  .hero{height:calc(100vh - 106px);max-height:none}
  .hero img{object-position:50% 25%}
  .hero-txt{left:48px;right:48px;bottom:40px;flex-direction:row;align-items:flex-end;justify-content:space-between;gap:32px}
  .hero-txt>div{display:flex;flex-direction:column;gap:12px}
  .hero h1,.hero h2{font-size:clamp(64px,7vw,104px)}
  .hero-row{gap:28px;margin:0}
  .hero-row b{font-size:24px}
  .hero-row span{height:56px;padding:0 44px}
  .shop{padding:12px 0 48px}
  .shop,.shop .grp-hd{scroll-margin-top:72px}
  .shop>*{max-width:1240px;margin-left:auto;margin-right:auto}
  .shop .grp-hd{margin:0 auto;padding:40px 24px 12px}
  .grid{grid-template-columns:repeat(4,1fr);gap:16px 24px;padding:8px 24px 16px}
  .grid.g7{grid-template-columns:repeat(4,1fr)}
  .card b{font-size:13px}
  .foot{flex-direction:row;justify-content:space-between;padding:32px 48px}
  .d-prod{display:grid;grid-template-columns:auto minmax(0,560px);justify-content:center;gap:56px;padding:120px 48px 96px;align-items:start}
  .d-gal{display:flex;gap:16px;align-items:flex-start}
  .d-main{position:relative;width:520px;height:650px;overflow:hidden;border:1px solid var(--line);background:#fff}
  .d-main img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 10%}
  .d-main img.co{object-fit:contain}
  .d-gal .thumbs{flex-direction:column;gap:12px}
  .d-gal .thumb{width:88px;height:110px}
  .d-info{display:flex;flex-direction:column;gap:14px;padding-top:12px}
  .d-info .kick{color:var(--grey)}
  .d-info h1{margin:0;font:400 80px/.86 'Bebas Neue',sans-serif;text-wrap:pretty}
  .d-info p{margin:0;font:400 15px/1.6 'Inter',sans-serif;color:var(--grey)}
  .d-info .p{font:500 26px/1 'Inter',sans-serif;color:var(--gold);margin-top:4px}
  .d-buy{display:flex;flex-direction:column;gap:20px;border-top:1px solid var(--line);padding-top:28px;margin-top:12px}
  .d-buy .size{min-width:56px;height:56px;font-size:22px}
  .d-buy .color{height:56px;padding:0 16px}
  .d-buy .add{height:60px;padding:0 24px;font-size:19px}
  .d-ov{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.7)}
  .d-cart{position:fixed;top:80px;left:50%;transform:translateX(-50%);width:720px;max-width:calc(100vw - 48px);max-height:calc(100vh - 120px);z-index:21;background:#0A0A0A;border:1px solid var(--gold);display:flex;flex-direction:column;animation:fadeIn .25s ease}
  .d-cart-hd{display:flex;align-items:center;justify-content:space-between;height:72px;padding:0 32px;border-bottom:1px solid var(--line);flex:none}
  .d-cart-hd h2{margin:0;font:400 26px/1 'Bebas Neue',sans-serif;letter-spacing:.1em}
  .d-cart-hd h2 b{color:var(--gold);font-weight:400}
  .d-cart-hd button{font:300 30px/1 'Inter',sans-serif}
  .d-cart-list{overflow:auto;padding:0 32px}
  .d-item{display:grid;grid-template-columns:80px 1fr auto;gap:20px;align-items:center;padding:20px 0;border-bottom:1px solid var(--line)}
  .d-item>img{width:80px;aspect-ratio:4/5;object-fit:contain;background:#fff;border:1px solid var(--line)}
  .d-item h3{margin:0;font:400 24px/.95 'Bebas Neue',sans-serif}
  .d-item .v{margin-top:6px;font:400 11px/1 'Inter',sans-serif;letter-spacing:.1em;color:var(--grey);text-transform:uppercase}
  .d-item .r{margin-top:12px;display:flex;align-items:center;gap:16px}
  .d-item .t{font:500 15px/1 'Inter',sans-serif;color:var(--gold)}
  .d-cart-ft{padding:24px 32px 32px;display:flex;align-items:center;justify-content:space-between;gap:32px;border-top:1px solid var(--line);flex:none}
  .d-cart-ft small{display:block;font:500 10px/1 'Inter',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--grey)}
  .d-cart-ft b{display:block;margin-top:8px;font:500 24px/1 'Inter',sans-serif;color:var(--gold)}
  .d-cart-ft em{display:block;margin-top:8px;font:400 11px/1 'Inter',sans-serif;color:var(--grey);font-style:normal}
  .d-cart-ft .gold-btn{height:60px;padding:0 64px;font-size:19px}
  .d-empty{padding:56px 32px 64px;display:flex;flex-direction:column;align-items:flex-start;gap:28px}
  .d-empty h3{margin:0;font:400 48px/.95 'Bebas Neue',sans-serif}
  .d-menu{width:420px}
}
@media (min-width:900px) and (max-width:1200px){
  .d-prod{grid-template-columns:1fr;justify-items:center}
  .d-gal{flex-direction:column-reverse;align-items:center}
  .d-gal .thumbs{flex-direction:row}
  .d-main{width:min(520px,100%)}

 if(r.cart){
  h+='<div class="d-ov" data-back></div><div class="d-cart"><div class="d-cart-hd"><h2>Cart <b>('+n+')</b></h2><button data-back aria-label="Close">×</button></div>';
  if(n)h+='<div class="d-cart-list">'+cartItems('d')+'</div><div class="d-cart-ft"><div><small>Subtotal</small><b>'+money(subtotal())+'</b><em>'+shipNote(n)+'</em></div><a class="gold-btn" href="'+checkoutUrl()+'">Checkout</a></div>';
  else h+='<div class="d-empty"><h3>Nothing here yet.</h3><button class="ghost-btn" data-go="#/shop">Shop the drop</button></div>';
  h+='</div>';
 }
 return h;
}

var mq=matchMedia('(min-width:900px)'),prevView=null,lastPx=-1;
function render(){
 var r=route();
 if(r.view==='product'){
  if(r.view!==prevView||lastPx!==r.p.i){S.pi=r.p.i;S.color=r.color||r.p.sc;if(!vv(r.p,S.color,S.size))S.size=vv(r.p,S.color,'M')?'M':r.p.sizes.filter(function(s){return vv(r.p,S.color,s)})[0]||S.size;lastPx=S.pi;S.slide=0;px('ViewContent',r.p,S.color,S.size)}
 }else lastPx=-1;
 if(r.view!==prevView){S.slide=0;S.qty=1;prevView=r.view;if(!r.cart&&!r.sheet)scrollTo(0,0)}
 var host=mq.matches?document.getElementById('desk'):document.getElementById('mob');
 host.innerHTML=mq.matches?renderDesk(r):renderMob(r);
 var tr=document.querySelector('[data-track]');if(tr&&S.slide)tr.scrollLeft=S.slide*tr.clientWidth;
 document.body.classList.toggle('noscroll',!!(r.cart||r.menu||r.sheet));
 var seen=1;try{if(r.sheet)localStorage.setItem('it_dd','1');seen=localStorage.getItem('it_dd')}catch(e){}
 document.body.classList.toggle('nudge',!seen);
}
mq.addEventListener?mq.addEventListener('change',render):mq.addListener(render);
addEventListener('hashchange',render);
document.addEventListener('click',function(e){var a=e.target.closest('a[href*="/cart/"]');if(!a)return;var n=count(),val=+subtotal().toFixed(2),ids=S.cart.map(function(x){return vv(CAT[x.pi],x.color,x.size)[0]});
 if(window.fbq)fbq('track','InitiateCheckout',{content_type:'product',content_ids:ids,num_items:n,value:val,currency:'USD'});
 if(window.ttq)ttq.track('InitiateCheckout',{contents:S.cart.map(function(x){return{content_id:String(vv(CAT[x.pi],x.color,x.size)[0]),content_type:'product',content_name:CAT[x.pi].name,quantity:x.qty}}),value:val,currency:'USD'})});
function markThumb(i){document.querySelectorAll('.thumb').forEach(function(b,k){b.classList.toggle('on',k===i)})}
function showSlide(i,fromThumb){markThumb(i);var tr=document.querySelector('[data-track]');if(tr){if(fromThumb)tr.scrollTo({left:i*tr.clientWidth,behavior:'smooth'});return}var m=document.querySelector('.d-main');if(m)m.innerHTML=gimg(gallery(CAT[S.pi])[i],i,CAT[S.pi].name)}
document.addEventListener('scroll',function(e){var tr=e.target;if(!(tr instanceof Element)||!tr.hasAttribute('data-track'))return;var i=Math.round(tr.scrollLeft/tr.clientWidth);if(i!==S.slide){S.slide=i;markThumb(i)}},true);
document.addEventListener('submit',function(e){var f=e.target.closest('[data-cf]');if(!f)return;e.preventDefault();var m=f.querySelector('[data-cf-msg]'),b=f.querySelector('button');b.disabled=true;m.textContent='Sending…';
 fetch('/',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(new FormData(f)).toString()}).then(function(r){if(!r.ok)throw 0;f.reset();m.textContent='Sent. We will get back to you.'}).catch(function(){m.textContent='Could not send. Try again in a moment.'}).then(function(){b.disabled=false});});

document.addEventListener('click',function(e){
 var t=e.target.closest('[data-go],[data-back],[data-size],[data-color],[data-q],[data-add],[data-slide],[data-cq],[data-rm]');
 if(!t)return;
 var d=t.dataset,p=CAT[S.pi];
 if(d.go!==undefined){e.preventDefault();go(d.go);return}
 if(d.back!==undefined){e.preventDefault();history.length>1?history.back():go('#/');return}
 if(d.size){S.size=d.size}
 else if(d.color){S.color=d.color}
 else if(d.q){S.qty=Math.max(1,S.qty+ +d.q)}
 else if(d.slide!==undefined){S.slide=+d.slide;showSlide(S.slide,true);return}
 else if(d.add!==undefined){
  if(!vv(p,S.color,S.size)){toast(S.color+' '+S.size+' is sold out');return}
  px('AddToCart',p,S.color,S.size,S.qty);
  var key=S.pi+'|'+S.size+'|'+S.color,ex=S.cart.filter(function(x){return x.key===key})[0];
  if(ex)ex.qty+=S.qty;else S.cart.push({key:key,pi:S.pi,size:S.size,color:S.color,qty:S.qty});
  save();toast('Added · '+p.name+' · '+S.color+' '+S.size);go('#/cart');return;
 }
 else if(d.cq){S.cart.forEach(function(x){if(x.key===d.key)x.qty=Math.max(1,x.qty+ +d.cq)});save()}
 else if(d.rm){S.cart=S.cart.filter(function(x){return x.key!==d.rm});save()}
 render();
});
// ad links use ?p=<id> (Meta appends UTM params to the query, which breaks #/ routes)
var qp=location.search.match(/[?&]p=(\w+)/);if(qp&&!location.hash)history.replaceState(null,'','#/product/'+qp[1]);
render();
// catalog ads (several designs) use ?c=<all|ls|tees|chest>: land on that product grid instead of the hero
var qc=location.search.match(/[?&]c=(\w+)/);if(qc&&!qp&&(!location.hash||location.hash==='#/')){history.scrollRestoration='manual';var toGrid=function(){var g=document.getElementById('g-'+qc[1])||document.getElementById('g-all');if(g&&!location.hash.replace('#/',''))g.scrollIntoView()};toGrid();addEventListener('load',toGrid);setTimeout(toGrid,700)}
})();
</script>
</body>
</html>
