<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Hugo · the dorm</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0a0a0a;
    font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;}
  #menuBtn{position:fixed;left:16px;bottom:16px;background:rgba(0,0,0,.60);
    border:1px solid rgba(255,255,255,.18);color:#e0e0e0;padding:6px 14px;
    border-radius:9px;font-size:11px;letter-spacing:.14em;cursor:pointer;
    font-family:monospace;text-transform:uppercase;z-index:30;user-select:none;}
  #menuBtn:hover{background:rgba(255,255,255,.10);}
  #hud{position:fixed;left:16px;bottom:52px;color:#e6e6e6;font-size:12px;line-height:1.8;
    background:rgba(0,0,0,.80);padding:12px 16px;border-radius:12px;
    border:1px solid rgba(255,255,255,.10);max-width:52ch;
    display:none;backdrop-filter:blur(8px);}
  #crosshair{position:fixed;left:50%;top:50%;width:10px;height:10px;
    transform:translate(-50%,-50%);pointer-events:none;}
  #crosshair:before,#crosshair:after{content:"";position:absolute;background:#f0f0f0;opacity:.9;}
  #crosshair:before{width:10px;height:1px;left:0;top:4.5px;}
  #crosshair:after{width:1px;height:10px;left:4.5px;top:0;}
  #crosshair.ads::before{width:6px!important;}
  #crosshair.ads::after{height:6px!important;}
  #interact{position:fixed;left:50%;bottom:18%;transform:translateX(-50%);
    color:#f5f5f5;background:rgba(0,0,0,.55);padding:8px 12px;border-radius:10px;
    font-size:13px;letter-spacing:.2px;opacity:0;transition:opacity .15s ease;
    border:1px solid rgba(255,255,255,.08)}
  #notice{position:fixed;right:16px;top:16px;color:#ddd;background:rgba(0,0,0,.55);
    padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.1);
    font-size:12px;max-width:56ch}
  #vignette{position:fixed;inset:0;pointer-events:none;will-change:opacity;
    background:radial-gradient(ellipse at center,transparent 52%,rgba(0,0,0,.72) 100%);opacity:0;}
  #scope-overlay{position:fixed;inset:0;pointer-events:none;opacity:0;display:none;
    background:radial-gradient(circle 97px at 50% 50%,transparent 96px,rgba(6,6,6,.97) 97px);}
  #scope-overlay::before,#scope-overlay::after{content:'';position:absolute;background:rgba(190,190,190,.55);}
  #scope-overlay::before{left:50%;top:50%;width:1px;height:148px;transform:translate(-50%,-50%);}
  #scope-overlay::after{left:50%;top:50%;width:148px;height:1px;transform:translate(-50%,-50%);}
  /* PiP second camera */
  #pip{position:fixed;bottom:90px;right:16px;width:260px;height:162px;
    border:1px solid rgba(255,255,255,.12);border-radius:8px;overflow:hidden;
    pointer-events:none;box-shadow:0 4px 24px rgba(0,0,0,.6);display:none;}
  #pip canvas{display:block;width:100%!important;height:100%!important;}
  #pipLabel{position:absolute;top:5px;left:8px;font-size:9px;letter-spacing:.18em;
    color:rgba(255,255,255,.35);font-family:monospace;pointer-events:none;z-index:2;}
  /* Load Hugo button */
  #loadHugoBtn{position:fixed;top:16px;left:16px;background:rgba(0,200,100,.15);
    border:1px solid rgba(0,255,120,.4);color:#00ff88;padding:7px 14px;border-radius:8px;
    font-size:11px;letter-spacing:.15em;cursor:pointer;font-family:monospace;
    text-transform:uppercase;transition:background .2s;}
  #loadHugoBtn:hover{background:rgba(0,200,100,.28);}
  #glbInput,#crosshair,#hugoHud,#weaponBar,#mjBar,#loadHugoBtn,#interact{display:none!important;}
  #tpIndicator{position:fixed;top:48px;left:16px;font-size:10px;letter-spacing:.15em;
    color:rgba(255,255,255,.35);font-family:monospace;text-transform:uppercase;}
</style>
<script>
(function(){
  function load(src,cb){var s=document.createElement('script');s.src=src;s.async=true;
    s.onload=()=>cb();s.onerror=()=>cb();document.head.appendChild(s);}
  window.loadTHREE=function(done){
    if(window.THREE)return done();
    load('https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js',function(){
      if(window.THREE)return done();
      load('https://unpkg.com/three@0.128.0/build/three.min.js',done);
    });
  };
})();
</script>
</head>
<body>
<div id="hud"></div>
<button id="menuBtn" onclick="var h=document.getElementById('hud');h.style.display=h.style.display==='block'?'none':'block'">☰ CONTROLS</button>
<div id="interact">Press E</div>
<div id="crosshair"></div>
<div id="vignette"></div>
<div id="scope-overlay"></div>
<div id="notice">Loading engine…</div>
<div id="pip"><div id="pipLabel">CAM-2 SHOULDER</div></div>
<button id="loadHugoBtn" onclick="document.getElementById('glbInput').click()">⬆ Load Hugo.glb</button>
<input type="file" id="glbInput" accept=".glb,.gltf"/>
<div id="tpIndicator">FP MODE</div>

<script>
loadTHREE(function(){
  /*
  ╔══════════════════════════════════════════════════════════════╗
  ║  HUGO DORM — AGENT INTEGRATION GUIDE                        ║
  ╠══════════════════════════════════════════════════════════════╣
  ║  window.HugoAgent   — Hugo's internal/external state        ║
  ║    .getState()      — {health,pain,stress,alertness,...}     ║
  ║    .takeDamage(part,amount,pos)                              ║
  ║    .setState(patch) — override any state field               ║
  ║    .on('damage',cb) — subscribe to damage events            ║
  ║    .on('death',cb)  — subscribe to death event              ║
  ║    .reset()         — full state reset                       ║
  ║                                                              ║
  ║  window.DormBridge  — frame-by-frame integration            ║
  ║    .onTick(cb)      — cb({dt,hugoState,playerPos,physicsMode}) ║
  ║    .sendCommand({type:'damage',amount:10,part:'head'})       ║
  ║    .sendCommand({type:'teleport',x:0,z:0})                   ║
  ║    .sendCommand({type:'reset'})                              ║
  ║                                                              ║
  ║  MuJoCo: set MUJOCO_URL = your wss:// tunnel URL            ║
  ║  Badge goes GREEN + pulses when realtime physics active      ║
  ╚══════════════════════════════════════════════════════════════╝
  */
  const _gs=document.createElement('script');
  _gs.src='https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js';
  _gs.onload=()=>{window._gltfReady=true;};
  _gs.onerror=()=>{window._gltfReady=false;console.error('GLTFLoader failed to load');};
  document.head.appendChild(_gs);

  const notice=document.getElementById('notice');
  const show=(m)=>{if(notice)notice.textContent=m;};
  // ── keyframes ────────────────────────────────────────────────────────────────
  const _kf=document.createElement('style');
  _kf.textContent=`
    @keyframes mjPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(1.5)}}
    @keyframes painFlash{0%{outline:3px solid rgba(255,0,0,.0)}50%{outline:3px solid rgba(255,0,0,.7)}100%{outline:3px solid rgba(255,0,0,.0)}}
  `;
  document.head.appendChild(_kf);

  // ── Physics badge ─────────────────────────────────────────────────────────
  const mjStatEl=document.createElement('div');
  mjStatEl.style.cssText='position:fixed;top:64px;left:16px;display:flex;align-items:center;gap:5px;font-size:9px;letter-spacing:.12em;font-family:monospace;text-transform:uppercase;';
  const _mjDot=document.createElement('span');
  _mjDot.style.cssText='width:7px;height:7px;border-radius:50%;background:rgba(255,100,100,.7);flex-shrink:0;';
  const _mjTxt=document.createElement('span');
  _mjTxt.style.color='rgba(255,100,100,.7)';
  _mjTxt.textContent='PHYSICS: PROCEDURAL';
  mjStatEl.appendChild(_mjDot);mjStatEl.appendChild(_mjTxt);
  document.body.appendChild(mjStatEl);
  function setPhysicsBadge(live){
    _mjDot.style.background=live?'rgba(0,255,136,.9)':'rgba(255,100,100,.7)';
    _mjDot.style.animation=live?'mjPulse 1.2s ease-in-out infinite':'none';
    _mjTxt.style.color=live?'rgba(0,255,136,.9)':'rgba(255,100,100,.7)';
    _mjTxt.textContent=live?'▶ PHYSICS: REALTIME MUJOCO':'▷ PHYSICS: PROCEDURAL';}

  // ── HugoAgent — internal + external state ────────────────────────────────
  const HugoAgent={
    state:{health:100,pain:0,alertness:50,stress:0,stamina:100,
           lastHitPart:null,lastHitTime:0,hitCount:0,alive:true,physicsMode:'procedural'},
    _boneImpulse:{}, _listeners:{},
    on(e,cb){(this._listeners[e]||(this._listeners[e]=[])).push(cb);},
    emit(e,d){(this._listeners[e]||[]).forEach(cb=>cb(d));},
    takeDamage(part,amount,pos){
      if(!this.state.alive)return;
      this.state.health=Math.max(0,this.state.health-amount);
      this.state.pain=Math.min(100,this.state.pain+amount*1.8);
      this.state.stress=Math.min(100,this.state.stress+amount*0.9);
      this.state.alertness=Math.min(100,this.state.alertness+35);
      this.state.lastHitPart=part;this.state.lastHitTime=performance.now();this.state.hitCount++;
      if(part){this._boneImpulse[part]={
        rx:(Math.random()-.5)*1.1,ry:(Math.random()-.5)*.5,rz:(Math.random()-.5)*.5,
        ttl:.4,maxTtl:.4};}
      if(this.state.health<=0){this.state.alive=false;this.emit('death',{part,pos});}
      this.emit('damage',{part,amount,health:this.state.health,pos});
      // screen flash
      document.body.style.animation='none';
      setTimeout(()=>{document.body.style.animation='painFlash .25s ease-out';},10);},
    update(dt){
      this.state.pain=Math.max(0,this.state.pain-dt*9);
      this.state.stress=Math.max(0,this.state.stress-dt*4);
      this.state.alertness=Math.max(50,this.state.alertness-dt*5);
      for(const k in this._boneImpulse){
        this._boneImpulse[k].ttl-=dt;
        if(this._boneImpulse[k].ttl<=0)delete this._boneImpulse[k];}},
    getState(){return{...this.state};},
    setState(p){Object.assign(this.state,p);this.emit('stateChange',this.state);},
    reset(){Object.assign(this.state,{health:100,pain:0,stress:0,alertness:50,hitCount:0,alive:true});
      this._boneImpulse={};this.emit('reset',this.state);}
  };
  window.HugoAgent=HugoAgent;

  // ── Hugo HUD ──────────────────────────────────────────────────────────────
  const _hhud=document.createElement('div');
  _hhud.id='hugoHud';
  _hhud.style.cssText=`position:fixed;bottom:90px;right:16px;width:190px;font-family:monospace;
    font-size:9px;letter-spacing:.08em;background:rgba(0,0,0,.78);border:1px solid rgba(255,255,255,.1);
    border-radius:8px;padding:10px 12px;display:none;user-select:none;`;
  _hhud.innerHTML=`<div style="color:rgba(255,255,255,.45);margin-bottom:6px;letter-spacing:.15em">HUGO // AGENT STATE</div>
    <div id="hh_hp" style="margin:2px 0"></div>
    <div id="hh_pain" style="margin:2px 0"></div>
    <div id="hh_stress" style="margin:2px 0"></div>
    <div id="hh_alert" style="margin:2px 0"></div>
    <div id="hh_hits" style="margin-top:5px;color:rgba(255,255,255,.35)"></div>
    <div id="hh_part" style="color:rgba(255,255,255,.35)"></div>`;
  document.body.appendChild(_hhud);
  function updateHugoHud(){
    const s=HugoAgent.state;
    _hhud.style.display='block';
    function bar(v,col){const f=Math.round(v/10);return `<span style="color:${col}">${'█'.repeat(f)}${'░'.repeat(10-f)}</span>`;}
    document.getElementById('hh_hp').innerHTML=`HP&nbsp;&nbsp;&nbsp;&nbsp;${bar(s.health,'#00ff88')} ${Math.round(s.health)}`;
    document.getElementById('hh_pain').innerHTML=`PAIN&nbsp;&nbsp;${bar(s.pain,'#ff3333')} ${Math.round(s.pain)}`;
    document.getElementById('hh_stress').innerHTML=`STRESS ${bar(s.stress,'#ffaa00')} ${Math.round(s.stress)}`;
    document.getElementById('hh_alert').innerHTML=`ALERT&nbsp;&nbsp;${bar(s.alertness,'#44aaff')} ${Math.round(s.alertness)}`;
    document.getElementById('hh_hits').textContent=`SHOTS HIT: ${s.hitCount}`;
    document.getElementById('hh_part').textContent=`LAST HIT: ${s.lastHitPart||'—'}`;}
  if(!window.THREE){show('THREE failed to load.');return;}
  const THREE=window.THREE;

  // ─── Procedural Textures ────────────────────────────────────────────────────
  function makeCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;
    return{c,ctx:c.getContext('2d',{alpha:false})};}
  function fillNoise(ctx,w,h,base,jit=8,al=22){
    ctx.fillStyle=base;ctx.fillRect(0,0,w,h);
    const img=ctx.getImageData(0,0,w,h);const d=img.data;
    for(let i=0;i<d.length;i+=4){const n=(Math.random()*2-1)*jit;
      d[i]=Math.min(255,Math.max(0,d[i]+n));
      d[i+1]=Math.min(255,Math.max(0,d[i+1]+n*.8));
      d[i+2]=Math.min(255,Math.max(0,d[i+2]+n*.6));d[i+3]=255;}
    ctx.putImageData(img,0,0);ctx.globalAlpha=al/255;
    for(let k=0;k<3;k++){
      const g=ctx.createRadialGradient(Math.random()*w,Math.random()*h,1,
        Math.random()*w,Math.random()*h,Math.random()*Math.max(w,h));
      g.addColorStop(0,'rgba(255,255,255,.3)');g.addColorStop(1,'rgba(0,0,0,.3)');
      ctx.fillStyle=g;ctx.fillRect(0,0,w,h);}ctx.globalAlpha=1;}
  function makeWallTex(tW=48,tH=24,gr=2){
    const sc=devicePixelRatio||1,W=Math.round(tW*sc),H=Math.round(tH*sc);
    const{c,ctx}=makeCanvas(W,H);fillNoise(ctx,W,H,'#6e6860',2,7);
    ctx.globalAlpha=.15;ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;
    ctx.fillStyle='#4e4840';ctx.fillRect(0,0,W,Math.max(1,gr*sc));ctx.fillRect(0,0,Math.max(1,gr*sc),H);
    ctx.strokeStyle='rgba(30,25,20,.18)';ctx.lineWidth=Math.max(1,gr*sc*.6);
    ctx.beginPath();ctx.moveTo(0,.5*gr*sc);ctx.lineTo(W,.5*gr*sc);
    ctx.moveTo(.5*gr*sc,0);ctx.lineTo(.5*gr*sc,H);ctx.stroke();
    const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=4;return t;}
  function makeFloorTex(tile=40,gr=2){
    const sc=devicePixelRatio||1,W=Math.round(tile*sc),H=Math.round(tile*sc);
    const{c,ctx}=makeCanvas(W,H);fillNoise(ctx,W,H,'#636058',2,6);
    const lin=ctx.createLinearGradient(0,0,W,H);
    lin.addColorStop(0,'rgba(255,255,255,.10)');lin.addColorStop(1,'rgba(0,0,0,.06)');
    ctx.fillStyle=lin;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#474340';ctx.fillRect(0,0,W,Math.max(1,gr*sc));ctx.fillRect(0,0,Math.max(1,gr*sc),H);
    ctx.strokeStyle='rgba(25,20,18,.18)';ctx.lineWidth=Math.max(1,gr*sc*.6);
    ctx.beginPath();ctx.moveTo(0,.5*gr*sc);ctx.lineTo(W,.5*gr*sc);
    ctx.moveTo(.5*gr*sc,0);ctx.lineTo(.5*gr*sc,H);ctx.stroke();
    const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=4;return t;}

  // ─── Scene & Renderers ──────────────────────────────────────────────────────
  const scene=new THREE.Scene();scene.background=new THREE.Color(0x0a0a0a);
  const renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(2,devicePixelRatio||1));
  renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=false;
  document.body.appendChild(renderer.domElement);

  // PiP renderer
  const PIP_W=260,PIP_H=162;
  const renderer2=new THREE.WebGLRenderer({antialias:true,alpha:true});
  renderer2.setPixelRatio(1);renderer2.setSize(PIP_W,PIP_H);
  document.getElementById('pip').appendChild(renderer2.domElement);

  // ─── Cameras ────────────────────────────────────────────────────────────────
  const EYE=1.67;
  const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.02,200);
  camera.position.set(0,EYE,1.75);camera.rotation.order='YXZ';
  scene.add(camera);

  // PiP shoulder camera
  const camera2=new THREE.PerspectiveCamera(65,PIP_W/PIP_H,.05,200);
  camera2.rotation.order='YXZ';

  let yaw=0,pitch=0;
  const MAX_PITCH=Math.PI/2-.01;
  function setLook(dx,dy){
    const ax=Math.abs(dx),ay=Math.abs(dy);
    if(ax>ay*1.8&&ay<.6)dy=0;if(ay>ax*1.8&&ax<.6)dx=0;
    yaw-=dx*.0022;pitch-=dy*.0022;
    pitch=Math.max(-MAX_PITCH,Math.min(MAX_PITCH,pitch));}

  // ── Mouse look ──
  let _ptrLocked=false,_dragLook=false,_lastMouse=null;
  function tryLock(){try{renderer.domElement.requestPointerLock();}catch(e){}}
  renderer.domElement.addEventListener('click',e=>{
    renderer.domElement.focus();
    if(!_ptrLocked)tryLock();});
  document.addEventListener('pointerlockchange',()=>{
    _ptrLocked=!!(document.pointerLockElement===renderer.domElement);
    show(_ptrLocked?'Pointer locked — P to unlock | WASD move | V 3P toggle'
      :'RIGHT-DRAG to look | LEFT-CLICK to fire | WASD move | V toggle 3P');});
  document.addEventListener('mousemove',e=>{
    if(_ptrLocked)setLook(e.movementX,e.movementY);});
  renderer.domElement.addEventListener('mousedown',e=>{
    if(e.button===2){
      if(!_ptrLocked&&!(window.SpawnLoadout&&SpawnLoadout.isActive())){_dragLook=true;_lastMouse={x:e.clientX,y:e.clientY};}
      if(window.SpawnLoadout&&SpawnLoadout.isActive())SpawnLoadout.setInput({ads:true});
      else player.adsHeld=true;
      e.preventDefault();}});
  renderer.domElement.addEventListener('mouseup',e=>{
    if(e.button===2){
      _dragLook=false;_lastMouse=null;
      if(window.SpawnLoadout&&SpawnLoadout.isActive())SpawnLoadout.setInput({ads:false});
      else player.adsHeld=false;}});
  renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault());
  document.addEventListener('mousemove',e=>{
    if(_dragLook&&!_ptrLocked&&_lastMouse){
      setLook(e.clientX-_lastMouse.x,e.clientY-_lastMouse.y);
      _lastMouse={x:e.clientX,y:e.clientY};}});

  // ─── Lights ─────────────────────────────────────────────────────────────────
  scene.add(new THREE.HemisphereLight(0xaabbcc,0x111111,.55));
  const dir=new THREE.DirectionalLight(0xdde0e8,.5);dir.position.set(3,5,2);scene.add(dir);
  const overhead=new THREE.PointLight(0xeef6ff,.45,12);overhead.position.set(0,2.5,0);scene.add(overhead);
  const flashlight=new THREE.SpotLight(0xffffff,1.2,10,Math.PI/8,.35,1);
  camera.add(flashlight);camera.add(flashlight.target);
  const setFlashTarget=()=>{
    const fwd=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
    flashlight.target.position.copy(camera.position).add(fwd);};

  // ─── Room ───────────────────────────────────────────────────────────────────
  const room={w:3.860,d:5.759,h:2.813};
  const wallTex=makeWallTex(60,30,2);
  const floorTex=makeFloorTex(40,2);
  const wTW=.60,wTH=.30,fT=.40;
  const wallMat=new THREE.MeshStandardMaterial({map:wallTex,roughness:.95});
  const floorMat=new THREE.MeshStandardMaterial({map:floorTex,roughness:.6});
  const ceilingMat=new THREE.MeshStandardMaterial({color:0x888888,roughness:1.0});
  const woodLight=new THREE.MeshStandardMaterial({color:0xcdaa76,roughness:.75});
  const woodDark=new THREE.MeshStandardMaterial({color:0x6e553b,roughness:.7});
  const bedding=new THREE.MeshStandardMaterial({color:0x0b214a,roughness:.95});
  const metalBlack=new THREE.MeshStandardMaterial({color:0x222222,roughness:.45,metalness:.6});
  const applianceW=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.35});
  const fridgeBlk=new THREE.MeshStandardMaterial({color:0x111111,roughness:.45});

  const floor=new THREE.Mesh(new THREE.PlaneGeometry(room.w,room.d),floorMat);
  floor.rotation.x=-Math.PI/2;floor.material.map.repeat.set(room.w/fT,room.d/fT);scene.add(floor);
  const ceiling=new THREE.Mesh(new THREE.PlaneGeometry(room.w,room.d),ceilingMat);
  ceiling.rotation.x=Math.PI/2;ceiling.position.set(0,room.h,0);scene.add(ceiling);

  function makeWall(width,height,rotY,pos){
    const mat=new THREE.MeshStandardMaterial({map:wallTex,roughness:.95,side:THREE.DoubleSide});
    mat.map=mat.map.clone();mat.map.wrapS=mat.map.wrapT=THREE.RepeatWrapping;
    mat.map.repeat.set(width/wTW,height/wTH);mat.map.center.set(.5,.5);
    const m=new THREE.Mesh(new THREE.PlaneGeometry(width,height,1,1),mat);
    m.position.set(pos[0],pos[1],pos[2]);m.rotation.y=rotY;return m;}
  const backWall=makeWall(room.w,room.h,0,[0,room.h/2,-room.d/2]);scene.add(backWall);
  const frontWall=makeWall(room.w,room.h,Math.PI,[0,room.h/2,room.d/2]);scene.add(frontWall);
  const leftWall=makeWall(room.d,room.h,-Math.PI/2,[-room.w/2,room.h/2,0]);scene.add(leftWall);
  const rightWall=makeWall(room.d,room.h,Math.PI/2,[room.w/2,room.h/2,0]);scene.add(rightWall);

  const curtains=new THREE.Mesh(new THREE.PlaneGeometry(2.2,1.8),
    new THREE.MeshStandardMaterial({color:0xeee7d6,roughness:.95}));
  curtains.position.set(0,1.6,-room.d/2+.01);scene.add(curtains);
  const heater=new THREE.Mesh(new THREE.BoxGeometry(2.2,.18,.08),
    new THREE.MeshStandardMaterial({color:0xf0f0f0,roughness:.6}));
  heater.position.set(0,.24,-room.d/2+.04);scene.add(heater);

  const DOOR_W=.92,DOOR_H=2.05,DOOR_T=.045,DOOR_X=0,FRONT_Z=room.d/2;
  scene.remove(frontWall);
  const wallSideW=(room.w-DOOR_W)*.5,headerH=room.h-DOOR_H;
  function makeFWP(width,height,cx,cy,cz){

  function buildMjBoneMap(root){

      for(const pat of patterns){

          const n=b.name.toLowerCase();
          const matchPat=n.includes(pat.toLowerCase());
          if(!matchPat)return false;
          if(!side)return true;
          const sL=side==='L';

      // Same axis swap as the root quat, applied on top of the bone's rest pose: local = rest * R^-1 * q * R.

              e.code==='Digit4'?3:e.code==='Digit5'?4:-1;
      if(n<0)return;
      updateWeaponBar(_defSlots,n);
      if(weaponVMGroup){camera.remove(weaponVMGroup);weaponVMGroup=null;}
      currentWeaponType=_defSlots[n].type;
      weaponVMGroup=buildWeaponViewModel({type:currentWeaponType});
      _applyVMPreset(weaponVMGroup,currentWeaponType);
      camera.add(weaponVMGroup);});
  }

  // ── H key toggles Hugo HUD ────────────────────────────────────────────────
  addEventListener('keydown',e=>{if(e.code==='KeyH'){
    const h=document.getElementById('hugoHud');
    h.style.display=h.style.display==='none'?'block':'none';}});
  // ── Agent Architecture Integration Bridge ──────────────────────────────────
  // window.DormBridge exposes hooks for your external agent folder.
  // Call DormBridge.onTick(cb) to receive {dt, hugoState, playerPos} every frame.
  // Call DormBridge.sendCommand({type:'damage',amount:10}) etc. from your agent.
  window.DormBridge={
    _tickCbs:[],
    onTick(cb){this._tickCbs.push(cb);},
    sendCommand(cmd){
      if(cmd.type==='damage')HugoAgent.takeDamage(cmd.part||'torso',cmd.amount||10,new THREE.Vector3());
      if(cmd.type==='reset')HugoAgent.reset();
      if(cmd.type==='setState')HugoAgent.setState(cmd.state);
      if(cmd.type==='teleport'){player.x=cmd.x||0;player.z=cmd.z||0;}},
    _tick(dt){this._tickCbs.forEach(cb=>cb({
      dt, hugoState:HugoAgent.getState(),
      playerPos:{x:player.x,y:player.y,z:player.z},
      physicsMode:HugoAgent.state.physicsMode}));}};

  // Embedded in the portfolio: sleep while the frame is scrolled out of view (the dorm otherwise costs the page
  // about half its frame rate from off screen). Same-origin, so it can look at its own frame; checked twice a second.
  let _offscreen=false,_visN=0;
  function offscreen(){
    if(++_visN%30)return _offscreen;
    try{const fe=window.frameElement;if(!fe)return _offscreen=false;
      const r=fe.getBoundingClientRect(),h=parent.innerHeight;_offscreen=r.bottom<-50||r.top>h+50||parent.document.hidden;}catch(e){_offscreen=false;}
    return _offscreen;}
  function loop(){
    if(offscreen()){simLast=performance.now()/1000;requestAnimationFrame(loop);return;}
    const now=performance.now()/1000;let dt=now-simLast;simLast=now;
    if(dt>MAX_FRAME)dt=MAX_FRAME;simAcc+=dt;
    while(simAcc>=FIXED_DT){fixedUpdate(FIXED_DT);simAcc-=FIXED_DT;}
    _lastDt=dt;
    animateHinges(dt);updateBullets(dt);
    // Procedural bones when MuJoCo not connected
    // procedural bone animation DISABLED — MuJoCo only
    DormBridge._tick(dt);
    renderFrame(simAcc/FIXED_DT);
    requestAnimationFrame(loop);}
  // Init Hugo with random weapon — all functions now defined
  const _HUGO_WP_TYPES=['pistol','smg','ar','dmr','sniper'];
  spawnHugoWeapon(_HUGO_WP_TYPES[Math.floor(Math.random()*_HUGO_WP_TYPES.length)]);

  renderer.render(scene,camera);requestAnimationFrame(loop);
  addEventListener('resize',()=>{
    camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);});
  show(TOUCH?'Left stick walks, push to the edge to run · drag to look · USE opens doors'
    :'Click to look around · WASD walk · Shift run · Space jump · E doors · V third person');
});
</script>
